[package]
name = "urage-now-desktop"
version = "0.1.0"
description = "URage NOW desktop shell"
authors = ["URage NOW"]
edition = "2021"

[lib]
name = "urage_now_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "urage-now-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
