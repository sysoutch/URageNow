<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Recorder</title>
  <script src="../../shared/dashboard-theme.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body data-dashboard-theme="fire">
  <main class="video-shell">
    <section class="hero-card">
      <p class="eyebrow">Video Tool</p>
      <h1>Video Recorder</h1>
      <p class="subtitle">Record webcam video with optional microphone audio and export the result back into the dashboard tools pipeline.</p>
    </section>

    <section class="control-card" data-dashboard-tool-sidebar data-dashboard-tool-sidebar-label="Video Controls">
      <div class="field-grid">
        <label>
          <span>Camera</span>
          <select id="video-device-select"></select>
        </label>
        <label>
          <span>Microphone</span>
          <select id="audio-device-select"></select>
        </label>
      </div>
      <label class="toggle-row">
        <input id="include-audio-toggle" type="checkbox" checked>
        <span>Include microphone audio</span>
      </label>
      <div class="button-row">
        <button id="refresh-devices-button" type="button">Refresh Devices</button>
        <button id="start-recording-button" type="button">Start Recording</button>
        <button id="stop-recording-button" class="danger hidden" type="button">Stop</button>
      </div>
      <p id="status-output" class="status-line">Ready.</p>
    </section>

    <section class="preview-card">
      <video id="live-preview" autoplay muted playsinline></video>
      <div class="output-panel">
        <p class="eyebrow">Current Output</p>
        <h2 id="recording-title">No recording yet</h2>
        <video id="recording-preview" controls playsinline></video>
        <a id="download-link" class="download-link hidden" download="video-recording.webm">Download Recording</a>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
  <script src="/tools/shared/dashboard-current-output-autodescribe.js"></script>
</body>
</html>
