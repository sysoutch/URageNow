<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Poker Suite - v7.0 Final Table</title>
    <script src="../../shared/dashboard-theme.js"></script>
    <style>
        :root {
            --bg: #0a0a0c;
            --card: #16161a;
            --accent: #d4af37;
            --accent-glow: rgba(212, 175, 55, 0.3);
            --text: #e2e2e2;
            --muted: #888;
            --danger: #ef4444;
            --success: #10b981;
            --break: #3b82f6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        body { background: var(--bg); color: var(--text); overflow-x: hidden; }

        /* Navigation */
        nav { display: flex; background: #000; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 100; overflow-x: auto; white-space: nowrap; }
        .tab-btn { background: none; border: none; color: var(--muted); padding: 15px 20px; cursor: pointer; font-weight: 600; font-size: 0.8rem; text-transform: uppercase; transition: 0.3s; border-bottom: 3px solid transparent; flex-shrink: 0; }
        .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .view { display: none; animation: fadeIn 0.3s ease; }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* Clock Components */
        .dashboard-grid { display: grid; grid-template-columns: 2.5fr 1fr; gap: 20px; }
        .main-display { text-align: center; background: var(--card); border-radius: 20px; padding: 40px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .timer { font-size: clamp(4rem, 15vw, 10rem); font-weight: 800; font-variant-numeric: tabular-nums; color: var(--accent); text-shadow: 0 0 20px var(--accent-glow); line-height: 1; margin: 10px 0; }
        .blinds-banner { font-size: clamp(2rem, 8vw, 4.5rem); font-weight: 700; margin: 10px 0; }
        .stat-sidebar { background: var(--card); border-radius: 20px; padding: 20px; border: 1px solid #333; display: flex; flex-direction: column; gap: 15px; }

        /* Table Styling */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; color: var(--accent); font-size: 0.75rem; text-transform: uppercase; padding: 12px; border-bottom: 1px solid #333; }
        td { padding: 12px; border-bottom: 1px solid #222; font-size: 0.95rem; }
        tr.active-row { background: rgba(212, 175, 55, 0.1); border-left: 4px solid var(--accent); }
        tr.break-row { background: rgba(59, 130, 246, 0.05); color: var(--break); font-style: italic; }

        /* Controls */
        button.action { background: var(--accent); color: #000; border: none; padding: 12px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button.action:hover { transform: translateY(-2px); filter: brightness(1.1); }
        button.secondary { background: #333; color: #fff; }
        
        .input-box input { width: 100%; padding: 12px; background: #222; border: 1px solid #444; color: #fff; border-radius: 6px; margin-top: 5px; }

        /* Log */
        .log-container { height: 300px; overflow-y: auto; background: #000; border-radius: 10px; padding: 15px; font-family: monospace; font-size: 0.85rem; border: 1px solid #222; }

        @media (max-width: 900px) { .dashboard-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body data-dashboard-theme="fire">

<nav>
    <button class="tab-btn active" onclick="showTab('clock', event)">Clock</button>
    <button class="tab-btn" onclick="showTab('structure', event)">Structure</button>
    <button class="tab-btn" onclick="showTab('players', event)">Players</button>
    <button class="tab-btn" onclick="showTab('payouts', event)">Payouts</button>
    <button class="tab-btn" onclick="showTab('settings', event)">Setup</button>
</nav>

<div class="container">
    
    <div id="view-clock" class="view active">
        <div class="dashboard-grid">
            <div class="main-display">
                <div id="level-label" style="color: var(--accent); font-weight: bold; letter-spacing: 2px;">LEVEL 1</div>
                <div class="timer" id="timer-text">00:00</div>
                <div class="blinds-banner" id="blind-text">--- / ---</div>
                <div id="ante-text" style="font-size: 1.2rem; color: var(--muted);">NO ANTE</div>
                
                <div style="margin-top: 30px; display: flex; gap: 10px; justify-content: center;">
                    <button class="action" id="play-btn" onclick="toggleClock()">START</button>
                    <button class="action secondary" onclick="changeLevel(-1, true)">PREV</button>
                    <button class="action secondary" onclick="changeLevel(1, true)">NEXT</button>
                </div>
            </div>

            <div class="stat-sidebar">
                <div><small style="color: var(--accent)">NEXT</small><div id="next-blind" style="font-size: 1.4rem; font-weight: bold;">---</div></div>
                <hr style="border:0; border-top:1px solid #333">
                <div><small style="color: var(--accent)">PLAYERS</small><div id="players-ratio" style="font-size: 1.4rem; font-weight: bold;">0 / 0</div></div>
                <div><small style="color: var(--accent)">AVG STACK</small><div id="avg-stack" style="font-size: 1.4rem; font-weight: bold;">0</div></div>
                <hr style="border:0; border-top:1px solid #333">
                <div><small style="color: var(--accent)">RUNTIME</small><div id="total-runtime" style="font-size: 1.4rem; font-weight: bold;">00:00:00</div></div>
            </div>
        </div>
        <div id="clock-chip-legend" style="display:flex; justify-content:center; gap:15px; margin-top:30px; flex-wrap:wrap;"></div>
    </div>

    <div id="view-structure" class="view">
        <div class="main-display" style="text-align: left; padding: 20px;">
            <h2 style="color: var(--accent); margin-bottom: 20px;">Structure Sheet</h2>
            <table>
                <thead><tr><th>Level</th><th>Blinds</th><th>Ante</th><th>Tournament Time</th></tr></thead>
                <tbody id="structure-body"></tbody>
            </table>
        </div>
    </div>

    <div id="view-players" class="view">
        <div class="main-display" style="text-align: left; padding: 20px;">
            <h2 style="color: var(--accent)">Player Management</h2>
            <div style="display:flex; gap:10px; margin: 20px 0;">
                <input type="text" id="player-name-input" placeholder="Player Name..." style="flex:1; padding:12px; background:#222; border:1px solid #444; color:#fff; border-radius:6px;">
                <button class="action" onclick="addPlayer()">Add Player</button>
            </div>
            <div id="active-players-list"></div>
            <h3 style="margin: 20px 0 10px; font-size:0.9rem; color:var(--danger)">Out</h3>
            <div id="busted-players-list"></div>
        </div>
    </div>

    <div id="view-payouts" class="view">
        <div class="main-display" style="text-align: left;">
            <h2 style="color: var(--accent)">Prize Pool & Results</h2>
            <div style="font-size: 3rem; font-weight: 800; color: var(--success); margin: 10px 0;" id="total-pool">$0</div>
            <table><tbody id="payout-body"></tbody></table>
            <button class="action" style="margin-top: 30px; width: 100%;" onclick="exportTournamentData()">Download Tournament Summary (.txt)</button>
        </div>
    </div>

    <div id="view-settings" class="view">
        <div class="main-display" style="text-align: left;">
            <h2 style="color: var(--accent)">Tournament Setup</h2>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px; margin-top:20px;">
                <div class="input-box"><label>Level Mins</label><input type="number" id="set-time" value="20"></div>
                <div class="input-box"><label>Buy-in $</label><input type="number" id="set-buyin" value="50"></div>
                <div class="input-box"><label>Start SB</label><input type="number" id="set-sb" value="100"></div>
                <div class="input-box"><label>Starting Chips</label><input type="number" id="set-chips" value="10000"></div>
            </div>
            <button class="action" style="margin-top:30px; width:100%" onclick="applySettings()">Save & Reset All Data</button>
        </div>
    </div>
</div>

<audio id="bell" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>

<script>
    let players = [], busted = [], levels = [], currentLevel = 0, timeLeft = 0, totalSecs = 0, isRunning = false, clockInterval;
    let auditLog = [];
    let chips = [{v:100, c:'#fff'}, {v:500, c:'#ef4444'}, {v:1000, c:'#3b82f6'}, {v:5000, c:'#10b981'}, {v:25000, c:'#000'}];

    function init() { applySettings(true); renderChips(); }

    function addLog(msg) {
        auditLog.push(`[${new Date().toLocaleTimeString()}] ${msg}`);
    }

    function applySettings(silent = false) {
        const sb = parseInt(document.getElementById('set-sb').value);
        const time = parseInt(document.getElementById('set-time').value);
        levels = [];
        let curSB = sb;
        let cumulative = 0;

        for(let i=1; i<=30; i++) {
            levels.push({ type:'level', sb: curSB, bb: curSB*2, ante: i>=5 ? curSB*2 : 0, duration: time*60, t: cumulative });
            cumulative += time*60;
            if(i % 4 === 0) { levels.push({ type:'break', duration: 15*60, t: cumulative }); cumulative += 15*60; }
            curSB = (i % 2 === 0) ? curSB * 2 : Math.round(curSB * 1.5 / 25) * 25;
        }
        currentLevel = 0; timeLeft = levels[0].duration; totalSecs = 0;
        if(!silent) { players = []; busted = []; auditLog = []; addLog("Tournament Initialized."); }
        updateUI(); renderStructure(); calcPayouts(); renderPlayers();
        showTab('clock');
    }

    function toggleClock() {
        if(isRunning) { clearInterval(clockInterval); document.getElementById('play-btn').innerText = "RESUME"; addLog("Timer Paused"); }
        else {
            clockInterval = setInterval(() => { 
                if(timeLeft > 0) { timeLeft--; totalSecs++; updateUI(); }
                else { document.getElementById('bell').play(); changeLevel(1, false); }
            }, 1000);
            document.getElementById('play-btn').innerText = "PAUSE";
            addLog("Timer Started");
        }
        isRunning = !isRunning;
    }

    function changeLevel(dir, manual) {
        currentLevel = Math.max(0, Math.min(levels.length-1, currentLevel + dir));
        timeLeft = levels[currentLevel].duration;
        if(manual) addLog(`Manual Level Jump to ${currentLevel + 1}`);
        updateUI(); renderStructure();
    }

    function updateUI() {
        const lvl = levels[currentLevel];
        const next = levels[currentLevel+1] || lvl;
        document.getElementById('timer-text').innerText = fmt(timeLeft);
        document.getElementById('total-runtime').innerText = fmt(totalSecs, true);
        
        if(lvl.type === 'break') {
            document.getElementById('level-label').innerText = "BREAK";
            document.getElementById('blind-text').innerText = "PAUSED";
            document.getElementById('ante-text').innerText = "COLOR UP CHIPS";
        } else {
            document.getElementById('level-label').innerText = `LEVEL ${currentLevel + 1}`;
            document.getElementById('blind-text').innerText = `${lvl.sb.toLocaleString()} / ${lvl.bb.toLocaleString()}`;
            document.getElementById('ante-text').innerText = lvl.ante > 0 ? `BB ANTE: ${lvl.ante.toLocaleString()}` : 'NO ANTE';
        }
        document.getElementById('next-blind').innerText = next.type === 'break' ? 'BREAK' : `${next.sb.toLocaleString()} / ${next.bb.toLocaleString()}`;
        document.getElementById('players-ratio').innerText = `${players.length} / ${players.length + busted.length}`;
        const startChips = parseInt(document.getElementById('set-chips').value);
        document.getElementById('avg-stack').innerText = players.length ? Math.floor(((players.length + busted.length) * startChips) / players.length).toLocaleString() : '0';
    }

    function renderStructure() {
        document.getElementById('structure-body').innerHTML = levels.map((l, i) => `
            <tr class="${i === currentLevel ? 'active-row' : ''} ${l.type === 'break' ? 'break-row' : ''}">
                <td>${l.type === 'break' ? '-' : i+1}</td>
                <td>${l.type === 'break' ? 'BREAK' : l.sb.toLocaleString() + ' / ' + l.bb.toLocaleString()}</td>
                <td>${l.type === 'break' ? '-' : l.ante.toLocaleString()}</td>
                <td>${Math.floor(l.t/60)}m</td>
            </tr>
        `).join('');
    }

    function addPlayer() {
        const name = document.getElementById('player-name-input').value;
        if(!name) return;
        players.push({ id: Date.now(), name });
        document.getElementById('player-name-input').value = '';
        addLog(`Joined: ${name}`);
        renderPlayers(); updateUI(); calcPayouts();
    }

    function eliminate(id) {
        const idx = players.findIndex(p => p.id === id);
        const p = players.splice(idx, 1)[0];
        p.rank = players.length + 1;
        busted.unshift(p);
        addLog(`Busted: ${p.name} at ${p.rank}th place`);
        renderPlayers(); updateUI(); calcPayouts();
    }

    function renderPlayers() {
        document.getElementById('active-players-list').innerHTML = players.map(p => `<div class="player-card"><span>${p.name}</span><button class="bust-btn" onclick="eliminate(${p.id})">BUST</button></div>`).join('');
        document.getElementById('busted-players-list').innerHTML = busted.map(p => `<div class="player-card" style="opacity:0.5"><span>#${p.rank} ${p.name}</span></div>`).join('');
    }

    function calcPayouts() {
        const count = players.length + busted.length;
        const buyin = parseInt(document.getElementById('set-buyin').value);
        const total = count * buyin;
        document.getElementById('total-pool').innerText = `$${total.toLocaleString()}`;
        let struct = count >= 15 ? [50, 25, 15, 10] : (count >= 8 ? [60, 30, 10] : [70, 30]);
        if(count < 4) struct = [100];

        document.getElementById('payout-body').innerHTML = struct.map((pct, i) => {
            const winner = busted.find(p => p.rank === i+1) || (players.length === 1 && i === 0 ? players[0] : null);
            return `<tr><td style="color:var(--accent)">${i+1} Place (${pct}%)</td><td>${winner ? winner.name : '---'}</td><td>$${Math.floor(total*pct/100).toLocaleString()}</td></tr>`;
        }).join('');
    }

    function exportTournamentData() {
        const buyin = document.getElementById('set-buyin').value;
        const total = (players.length + busted.length) * buyin;
        let content = `TOURNAMENT SUMMARY - ${new Date().toLocaleDateString()}\n`;
        content += `==========================================\n`;
        content += `Total Entries: ${players.length + busted.length}\n`;
        content += `Total Prize Pool: $${total.toLocaleString()}\n`;
        content += `Total Duration: ${document.getElementById('total-runtime').innerText}\n\n`;
        content += `FINAL RANKINGS:\n`;
        if(players.length === 1) content += `1st: ${players[0].name} (WINNER)\n`;
        busted.forEach(p => content += `${p.rank}th: ${p.name}\n`);
        content += `\nAUDIT LOG:\n`;
        auditLog.forEach(line => content += `${line}\n`);

        const blob = new Blob([content], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `poker_results_${Date.now()}.txt`;
        a.click();
    }

    function fmt(s, long) {
        const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
        return long ? `${h}:${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}` : `${m}:${sec.toString().padStart(2,'0')}`;
    }

    function renderChips() {
        document.getElementById('clock-chip-legend').innerHTML = chips.map(c => `<div style="display:flex; align-items:center; gap:8px; background:#1f1f23; padding:5px 12px; border-radius:20px; border:1px solid #333;"><div style="width:12px; height:12px; border-radius:50%; background:${c.c}"></div><span style="font-size:0.75rem; font-weight:bold">${c.v.toLocaleString()}</span></div>`).join('');
    }

    function showTab(id, e) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('view-' + id).classList.add('active');
        if(e) e.target.classList.add('active');
    }

    init();
</script>
<script src="../../shared/dashboard-current-output-autodescribe.js"></script>
</body>
</html>
