<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>README Viewer</title>
    <script src="../../shared/dashboard-theme.js"></script>
    <link rel="stylesheet" href="/tools/shared/css/upload-btn.css">
    <link rel="stylesheet" href="css/base.css">
</head>
<body data-dashboard-theme="fire">
    <div class="file-input">
        <h2>README Viewer</h2>
        <p>Select a README.md file to display</p>
        <label class="upload-btn" for="fileInput">
          <span class="upload-btn-icon">📄</span>
          <span class="upload-btn-text">Upload Markdown File (.md)</span>
          <input type="file" id="fileInput" accept=".md" hidden>
        </label>
        <br>
        <button onclick="loadFile()">Load README</button>
    </div>
    <div id="readmeContent" class="readme-content" style="display: none;"></div>

    <script src="js/markdown-parser.js"></script>
    <script src="js/app.js"></script>
  <script src="../../shared/dashboard-current-output-autodescribe.js"></script>

</body>
</html>
